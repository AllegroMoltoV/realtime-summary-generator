[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-summary-generator"
version = "0.2.0"
description = "OBS向けの日本語字幕、英語字幕、日本語概要を生成する個人用ツール"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "google-genai>=1.0,<2",
  "obsws-python>=1.8,<2",
  "python-dotenv>=1.1,<2",
  "sounddevice>=0.5,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
realtime-summary = "realtime_summary.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
